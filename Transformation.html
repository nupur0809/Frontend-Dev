<!DOCTYPE html>
<html lang="en">
<head>

  <title>CSS Transformations Showcase</title>
  <link rel="stylesheet" href="q6.css">
</head>
<body>
  <header>
    <h1>CSS Transformations Showcase</h1>
  </header>

  <main class="transform-container">

      <p>Rotate</p>

      <p>Skew</p>
    </div>
  </main>

  <footer>
    <p>Created by Nupur | CSS Transform Practice</p>
  </footer>

</html>
