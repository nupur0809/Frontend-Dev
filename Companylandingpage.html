<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Startup Landing Page</title>
  <!-- ✅ Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Custom Styling */
    .hero {
      background: linear-gradient(135deg, #007bff, #00c4cc);
      color: white;
      padding: 100px 0;
      text-align: center;
    }
    .hero h1 {
      font-size: 3rem;
      font-weight: bold;
    }
    .hero p {
      font-size: 1.2rem;
      margin-top: 15px;
    }
    .hero .btn {
      margin-top: 25px;
      padding: 12px 30px;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- ✅ Header + Navbar -->
  <header class="bg-light shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-light bg-light container">
      <a class="navbar-brand fw-bold" href="#">StartupX</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Features</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Pricing</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <!-- ✅ Hero Section -->
  <section class="hero d-flex align-items-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <h1>Welcome to StartupX</h1>
          <p>Your journey to digital innovation starts here.</p>
          <a href="#" class="btn btn-light text-primary fw-bold">Get Started</a>
        </div>
      </div>
    </div>
  </section>

  <!-- ✅ Footer (optional) -->
  <footer class="text-center py-4 bg-light mt-5">
    <p class="mb-0">© 2025 StartupX. All rights reserved.</p>
  </footer>

  <!-- ✅ Bootstrap JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
