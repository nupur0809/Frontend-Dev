<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animations Demo</title>
  <link rel="stylesheet" href="q6-animations.css">
</head>
<body>
  <header>
    <h1>CSS Animations</h1>
    <p>Examples: moving box, bouncing ball, and color-changing text.</p>
  </header>

  <main>
    <section class="animations">
      <div class="box">Move</div>
      <div class="ball"></div>
      <h2 class="color-text">Color Changing Text</h2>
    </section>
  </main>

  <footer>
    <p>Smooth animations using @keyframes and CSS transitions.</p>
  </footer>
</body>
</html>
