<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .card:hover {
      transform: scale(1.03);
      transition: 0.3s;
    }
  </style>
</head>
<body>
<div class="container mt-5">
  <h2 class="text-center mb-4">Choose Your Plan</h2>
  <div class="row g-4 text-center">
    <div class="col-md-4">
      <div class="card shadow-sm p-3">
        <h4>Basic</h4>
        <p class="display-6">$9</p>
        <ul class="list-unstyled">
          <li>1 Project</li>
          <li>Email Support</li>
        </ul>
        <button class="btn btn-outline-primary mt-2">Choose</button>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card bg-primary text-white shadow-lg p-3">
        <h4>Pro</h4>
        <p class="display-6">$29</p>
        <ul class="list-unstyled">
          <li>5 Projects</li>
          <li>Priority Support</li>
        </ul>
        <button class="btn btn-light mt-2">Choose</button>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm p-3">
        <h4>Enterprise</h4>
        <p class="display-6">$49</p>
        <ul class="list-unstyled">
          <li>Unlimited Projects</li>
          <li>24/7 Support</li>
        </ul>
        <button class="btn btn-outline-primary mt-2">Choose</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
