<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Comparison Layout</title>
  <link rel="stylesheet" href="task7.css">
</head>
<body>
  <h1 class="title">Before and After Filter Comparison</h1>

  <section class="comparison-container">
    <!-- Left image: Original -->
    <div class="image-box">
      <img src="https://via.placeholder.com/500x300" alt="Original Image">
      <p class="caption">Before</p>
    </div>

    <!-- Right image: Filtered -->
    <div class="image-box filtered">
      <img src="https://via.placeholder.com/500x300" alt="Filtered Image">
      <p class="caption">After (Brightness Filter)</p>
    </div>
  </section>
</body>
</html>
