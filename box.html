<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box-Sizing Demo</title>
  <link rel="stylesheet" href="q8-box.css">
</head>
<body>
  <header>
    <h1>Box-Sizing Comparison</h1>
    <p>Compare default content-box vs border-box.</p>
  </header>

  <main>
    <section class="boxes">
      <div class="box content-box">Content-box</div>
      <div class="box border-box">Border-box</div>
    </section>
  </main>

  <footer>
    <p>Observe how width and padding behave differently.</p>
  </footer>
</body>
</html>
