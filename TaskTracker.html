<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h3 class="text-center mb-3">Tasks <span class="badge bg-primary">5</span></h3>

  <ul class="list-group">
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Design Homepage <span class="badge bg-danger">High</span>
    </li>
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Update Docs <span class="badge bg-warning text-dark">Medium</span>
    </li>
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Fix Bugs <span class="badge bg-success">Low</span>
    </li>
  </ul>

  <div class="text-center mt-3">
    <button class="btn btn-success">
      Completed <span class="badge bg-light text-dark">3</span>
    </button>
  </div>
</div>
</body>
</html>
