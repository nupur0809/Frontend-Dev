<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Members</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f8f9fa;
  padding: 40px;
}
h1 {
  text-align: center;
  margin-bottom: 30px;
}
.team-container {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
}
.member {
  background: white;
  width: 300px;
  padding: 20px;
  text-align: center;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  transition: transform 0.3s;
}
.member:hover {
  transform: scale(1.05);
}
.member img {
  width: 100%;
  border-radius: 12px;
}
.member.highlight {
  border: 3px solid #007bff;
}
</style>
</head>
<body>
<h1>Our Team</h1>
<div class="team-container">
  <div class="member">
    <img src="https://via.placeholder.com/300x200" alt="Member 1">
    <h3>John Doe</h3>
    <p>UI/UX Designer</p>
  </div>
  <div class="member highlight">
    <img src="https://via.placeholder.com/300x200" alt="Member 2">
    <h3>Jane Smith</h3>
    <p>Frontend Developer</p>
  </div>
  <div class="member">
    <img src="https://via.placeholder.com/300x200" alt="Member 3">
    <h3>Sam Wilson</h3>
    <p>Backend Engineer</p>
  </div>
</div>
</body>
</html>
