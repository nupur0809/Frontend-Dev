<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #89f7fe, #66a6ff);
  font-family: Arial, sans-serif;
}
form {
  background: white;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  width: 320px;
}
input, textarea {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 6px;
  border: 1px solid #ccc;
  outline: none;
  transition: border-color 0.3s;
}
input:focus, textarea:focus {
  border-color: #007bff;
}
button {
  width: 100%;
  padding: 10px;
  border: none;
  background: #007bff;
  color: white;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
}
button:hover {
  background: #0056b3;
}
</style>
</head>
<body>
<form>
  <h2>Contact Us</h2>
  <label>Name:</label>
  <input type="text" required>
  <label>Email:</label>
  <input type="email" required>
  <label>Subject:</label>
  <input type="text" required>
  <label>Message:</label>
  <textarea rows="4" required></textarea>
  <button type="submit">Send Message</button>
</form>
</body>
</html>
