<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Layout</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  display: flex;
  height: 100vh;
}
header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background: #007bff;
  color: white;
  text-align: center;
  padding: 15px;
  font-size: 20px;
  z-index: 100;
}
.sidebar {
  background: #343a40;
  color: white;
  width: 220px;
  padding-top: 60px;
  position: fixed;
  height: 100%;
}
.sidebar a {
  display: block;
  padding: 15px;
  color: white;
  text-decoration: none;
}
.sidebar a:hover {
  background: #495057;
}
.main {
  margin-left: 220px;
  padding: 80px 20px;
  flex: 1;
  background: #f8f9fa;
}
.box {
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  margin-bottom: 20px;
}
@media (max-width: 700px) {
  .sidebar {
    position: relative;
    width: 100%;
    height: auto;
  }
  .main {
    margin-left: 0;
    padding-top: 20px;
  }
}
</style>
</head>
<body>
<header>Dashboard Header</header>
<div class="sidebar">
  <a href="#">Home</a>
  <a href="#">Reports</a>
  <a href="#">Settings</a>
</div>
<div class="main">
  <div class="box">Box 1 Content</div>
  <div class="box">Box 2 Content</div>
</div>
</body>
</html>
