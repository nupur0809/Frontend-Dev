<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My portfolio</title>
    <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box
    }
    body{
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.6;
        background-color: beige;
        color: #333;
        min-height:100vh;
        display:flex;
        flex-direction:column;
    }
    header{
        position:fixed;
        top:0;
        left:0;
        width:100%;
        background-color: darkblue;
        color: #fff;
        padding:1rem 2%;
        display:flex;
        justify-content: space-between;
        align-items:center;
        z-index:1000;
    }
    header nav a{
        color:#fff;
        text-decoration: none;
        margin-left: 2em;
        font-size: 1rem;
        transition:color 0.3s;
    }
    header nav a:hover{
        color:#ffcc00
    }
    main{
        margin-top:6rem;
        flex:1;
        padding:2em;
        display:flex;
        flex-direction: column;
        align-items: center;
        text-align:center;
    }
    main img{
        width:150px;
        height:150px;
        border-radius:50%;
        margin-bottom:1em;
    }
    main p{
          max-width:600px;
          font-size:1.2em;
    }
    footer{
        background-color:#003366;
        color:#fff;
        padding :1em 0;
        text-align:center;
        flex-shrink:0;
    }
    h1{
        font-size: 2rem;
        margin-bottom: 0.5em;
    }
    main p{
        font-size:1.1rem;
    }
    main{
        padding:5vh 5%;
    }
    </style>
</head>
<body>
    <header>
        <h1>Nupur Agarwal</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <main>
        <img src="https://www.pixelstalk.net/wp-content/uploads/2016/10/Beautiful-Girl-Wallpaper-Widescreen.jpg" alt="Profile Picture">
        <p>
            Hello! I'm a passionate web developer with experience in creating dynamic and responsive websites.
            I enjoy learning new technologies and applying them to solve real-world problems.
        </p>
    </main>
    <footer>
        &copy; 2025 Nupur.All Rights Reserved.
    </footer>
    
</body>
</html>
