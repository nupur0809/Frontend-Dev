<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f8f9fa;
  margin: 0;
  padding: 40px;
}
h1 {
  text-align: center;
  margin-bottom: 30px;
}
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
}
.photo {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}
.photo:hover img {
  transform: scale(1.1);
}
.caption {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  text-align: center;
  background: rgba(0,0,0,0.6);
  color: #fff;
  padding: 10px;
  opacity: 0;
  transition: opacity 0.4s;
}
.photo:hover .caption {
  opacity: 1;
}
</style>
</head>
<body>
<h1>Photo Gallery</h1>
<div class="gallery">
  <div class="photo"><img src="https://via.placeholder.com/400x300" alt=""><div class="caption">Beach</div></div>
  <div class="photo"><img src="https://via.placeholder.com/400x300" alt=""><div class="caption">Mountains</div></div>
  <div class="photo"><img src="https://via.placeholder.com/400x300" alt=""><div class="caption">City Lights</div></div>
  <div class="photo"><img src="https://via.placeholder.com/400x300" alt=""><div class="caption">Forest</div></div>
  <div class="photo"><img src="https://via.placeholder.com/400x300" alt=""><div class="caption">Desert</div></div>
  <div class="photo"><img src="https://via.placeholder.com/400x300" alt=""><div class="caption">Lake</div></div>
</div>
</body>
</html>
