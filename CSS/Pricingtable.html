<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing Table</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f0f0f0;
  padding: 40px;
  text-align: center;
}
.pricing-container {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}
.plan {
  background: white;
  border-radius: 10px;
  padding: 20px;
  width: 250px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  transition: transform 0.3s, border 0.3s;
}
.plan:hover {
  transform: scale(1.05);
  border: 2px solid #007bff;
}
.plan.popular {
  border: 3px solid #007bff;
  transform: scale(1.1);
}
.price {
  font-size: 32px;
  margin: 10px 0;
  color: #007bff;
}
</style>
</head>
<body>
<h1>Pricing Plans</h1>
<div class="pricing-container">
  <div class="plan">
    <h3>Basic</h3>
    <p class="price">$9/mo</p>
    <p>1 GB Storage</p>
    <p>Email Support</p>
  </div>
  <div class="plan popular">
    <h3>Standard</h3>
    <p class="price">$19/mo</p>
    <p>10 GB Storage</p>
    <p>Priority Support</p>
  </div>
  <div class="plan">
    <h3>Premium</h3>
    <p class="price">$29/mo</p>
    <p>50 GB Storage</p>
    <p>24/7 Support</p>
  </div>
</div>
</body>
</html>
