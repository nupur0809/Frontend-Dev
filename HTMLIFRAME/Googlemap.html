<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Map Example</title>
</head>
<body>
  <h1>My City on Google Map</h1>

  <!-- The loading="lazy" attribute delays loading of the iframe 
       until it’s about to be visible on screen, improving performance -->
  <iframe
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14000.656!2d77.2!3d28.6!2m3!1f0!2f0!3f0"
    width="80%" height="400"
    title="My City Map"
    loading="lazy">
  </iframe>
</body>
</html>
