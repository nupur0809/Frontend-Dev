<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form Submission Example</title>
</head>
<body>
  <h1>Submit Form</h1>

  <form target="resultFrame">
    <input type="text" placeholder="Enter something" required>
    <input type="submit" value="Submit">
  </form>

  <iframe name="resultFrame" width="100%" height="100"></iframe>
</body>
</html>
