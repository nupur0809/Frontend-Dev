<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML Entities Example</title>
</head>
<body>
  <p>
    This paragraph shows HTML entities:  
    &lt; (less than), &gt; (greater than), &amp; (ampersand),  
    &quot; (double quote), &apos; (single quote).  
    Also symbols: &copy; (copyright), &trade; (trademark), &reg; (registered).
  </p>
</body>
</html>
