<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Sets character encoding to UTF-8 -->
  <meta charset="UTF-8">

  <!-- Page title shown in browser tab -->
  <title>Head Elements Example</title>

  <!-- Meta description and author -->
  <meta name="description" content="This page demonstrates all important HTML head tags.">
  <meta name="author" content="Nupur Agarwal">

  <!-- Ensures proper scaling on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Base URL for all relative links -->
  <base href="https://example.com/">

  <!-- Link to a favicon -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!-- Internal CSS (empty example) -->
  <style>
    /* CSS can be written here */
  </style>

  <!-- JavaScript (empty example) -->
  <script>
    // JS scripts can be written here
  </script>
</head>
<body>
  <h1>Complete HTML Head Example</h1>
  <p>This page demonstrates the use of all important <code>&lt;head&gt;</code> elements.</p>
</body>
</html>
