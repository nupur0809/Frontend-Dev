<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Form Example</title>
</head>
<body>
  <h1>Secure Login Form</h1>

  <form autocomplete="off">
    <label>Username:</label><br>
    <input type="text" required><br><br>

    <label>Password:</label><br>
    <input type="password" required><br><br>

    <input type="submit" value="Login">
  </form>

  <p><strong>Note:</strong> Turning off <code>autocomplete</code> prevents browsers from saving
  sensitive data like passwords, improving form security.</p>
</body>
</html>
