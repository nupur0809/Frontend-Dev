<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Login</title></head>
<body>
  <h1>Login Form</h1>
  <form>
    <label>Username:</label><input type="text" required><br><br>
    <label>Password:</label><input type="password" required><br><br>
    <!-- CSRF token prevents Cross-Site Request Forgery attacks -->
    <input type="hidden" name="csrf_token" value="12345ABC">
    <input type="submit" value="Login">
  </form>
</body>
</html>
