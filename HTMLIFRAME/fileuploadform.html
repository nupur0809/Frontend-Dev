<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>File Upload</title></head>
<body>
  <h1>Upload Your File</h1>
  <form>
    <input type="file" accept=".jpg, .png" required><br><br>
    <input type="submit" value="Upload">
  </form>
  <p>Only .jpg and .png files are allowed.</p>
</body>
</html>
