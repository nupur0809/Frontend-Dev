<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Combined Effects</title>
  <link rel="stylesheet" href="q9-effects.css">
</head>
<body>
  <header>
    <h1>Combined CSS Effects</h1>
    <p>Buttons with pseudo-classes, transitions, and transformations.</p>
  </header>

  <main>
    <section class="effects">
      <button class="effect-btn">Hover Me</button>
      <button class="effect-btn">Click Me</button>
      <button class="effect-btn">Focus Me</button>
    </section>
  </main>

  <footer>
    <p>Smooth effects with color, scale, and shadow on hover/focus.</p>
  </footer>
</body>
</html>
