<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Selectors Practice</title>
  <link rel="stylesheet" href="q4-selectors.css">
</head>
<body>
  <header>
    <h1>CSS Selectors Examples</h1>
  </header>

  <main>
    <section class="selectors">
      <p class="class-example">This paragraph uses a class selector.</p>
      <p id="id-example">This paragraph uses an ID selector.</p>
      <p title="attribute">This paragraph uses an attribute selector.</p>
      
      <div class="combinators">
        <p>Parent paragraph</p>
        <p>Sibling paragraph</p>
        <span>Child span</span>
      </div>

      <ul>
        <li>First item</li>
        <li>Second item</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>Selectors include element, class, ID, attribute, and combinators.</p>
  </footer>
</body>
</html>
