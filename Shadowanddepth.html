<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadows and Depth Effect</title>
  <link rel="stylesheet" href="q4.css">
</head>
<body>
  <header>
    <h1>Shadows and Depth Effect Layout</h1>
  </header>

  <main class="card-container">
    <div class="card">
      <h2>Profile 1</h2>
      <p>This card uses a soft light shadow.</p>
    </div>
    <div class="card middle">
      <h2>Profile 2</h2>
      <p>This card uses a medium shadow for more depth.</p>
    </div>
    <div class="card strong">
      <h2>Profile 3</h2>
      <p>This card uses a deeper shadow to look lifted.</p>
    </div>
  </main>

  <footer>
    <p>Created by Nupur | CSS Shadows Practice</p>
  </footer>
</body>
</html>
