<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family:Arial, Helvetica, sans-serif;
            background-color: #f5f7fa;
            margin:0;
            padding:40px;
            display:flex;
            justify-content: center;
            align-items:center;
            min-height:100vh;
        }
        .card-container{
            display:flex;
            gap:25px;
            animation:fadeIn 1s ease-in;
        }
        .card{
            background-color: #fff;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
            padding:20px;
            text-align:center;
            width:250px;
            transition:all 0.3s ease;
            animation:fadeIn 1.2s ease-in;
        }
        .card img{
            width:100%;
            border-radius:8px;
            filter:grayscale(100%);
            transition:filter 0.3s ease;
        }
        .card:hover{
            transform:translateY(-10px);
            box-shadow:0 10px 20px rgba(0,0,0,0.15);
        }
        .card:hover img{
            filter:none;
        }
        .card h2{
            margin:15px 0 5px;
            color:#333;
        }
        .card p{
            color:#666;
            font-size:0.95rem;
        }
        @keyframes fadeIn{
            from{
                obacity:0;
                transform:translateY(100px);
            }
            to{
                obacity:100;
                tranform:translateY(0px);
            }
        }
        @media(max-width:800px){
            .card-container{
                flex-direction:column;
                align-items:center;
            }
        }
    </style>
</head>
<body>
    <div class="card-container">
    <div class="card">
        <img src="https://tse2.mm.bing.net/th/id/OIP.G37tgeQqSNt7v2oPfj9ltQHaE7?pid=Api&P=0&h=180"> 
    </div>
    <div class="card">
        <img src="https://tse3.mm.bing.net/th/id/OIP.MInViflWTn0CIsOU3esbLwHaE5?pid=Api&P=0&h=180">
    </div>
    <div class="card">
        <img src="https://tse1.mm.bing.net/th/id/OIP.f179G4ExW3UJgFZTGhhRFgHaFj?pid=Api&P=0&h=180">
    </div>
    </div>
</body>
</html>
