<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h3 class="text-center mb-4">Notifications Dashboard</h3>

  <div class="card p-4">
    <div class="alert alert-success">✅ New message received!</div>
    <div class="alert alert-info">💡 Tip: Use Bootstrap grid for layouts!</div>
    <div class="alert alert-danger alert-dismissible fade show">
      ⚠️ Warning: Low storage!
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="bg-light border rounded p-3 mt-3">
      <p class="mb-0">Summary: 3 notifications today.</p>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
