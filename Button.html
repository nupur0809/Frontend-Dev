<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Styles Demo</title>
  <link rel="stylesheet" href="q5-buttons.css">
</head>
<body>
  <header>
    <h1>Styled Buttons</h1>
    <p>Different button styles with hover, focus, active, and disabled states.</p>
  </header>

  <main>
    <section class="buttons">
      <button class="primary">Primary</button>
      <button class="secondary">Secondary</button>
      <button class="outline">Outline</button>
      <button class="disabled" disabled>Disabled</button>
    </section>
  </main>

  <footer>
    <p>Buttons aligned neatly using Flexbox with smooth transitions.</p>
  </footer>
</body>
</html>
