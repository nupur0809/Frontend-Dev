<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Database</title>
</head>
<body>
  <h1 title="A simple movie list">🎬 Movie Database</h1>
  
  <table border="1" cellpadding="8" cellspacing="0" title="Movie Table">
    <caption>Top Rated Movies</caption>
    <thead>
      <tr>
        <th>Movie Name</th>
        <th>Genre</th>
        <th>Year</th>
        <th>IMDB Rating</th>
        <th>Link</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td rowspan="2">Inception</td>
        <td>Science Fiction</td>
        <td>2010</td>
        <td>8.8</td>
        <td><a href="#">View</a></td>
      </tr>
      <tr>
        <td colspan="4">Directed by Christopher Nolan</td>
      </tr>
      <tr>
        <td>Parasite</td>
        <td>Thriller</td>
        <td>2019</td>
        <td>8.6</td>
        <td><a href="#">View</a></td>
      </tr>
    </tbody>
  </table>

  <small>Note: Ratings are based on IMDB data.</small>
</body>
</html>
