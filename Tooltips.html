<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Demo</title>
  <link rel="stylesheet" href="q2-tooltips.css">
</head>
<body>
  <header>
    <h1>CSS Tooltips Example</h1>
    <p>Hover over icons or text to see tooltips fade in smoothly.</p>
  </header>

  <main>
    <section class="tooltip-examples">
      <div class="tooltip-container">
        <span class="tooltip-icon">ℹ️</span>
        <span class="tooltip-text">Information tooltip appears here</span>
      </div>

      <div class="tooltip-container">
        <span class="tooltip-icon">⚠️</span>
        <span class="tooltip-text">Warning! Be careful.</span>
      </div>

      <div class="tooltip-container">
        <span class="tooltip-icon">✅</span>
        <span class="tooltip-text">Success message!</span>
      </div>

      <div class="tooltip-container">
        <span class="tooltip-icon">💡</span>
        <span class="tooltip-text">Tip: You can use shortcuts.</span>
      </div>
    </section>
  </main>

  <footer>
    <p>All tooltips created with pure CSS using transitions.</p>
  </footer>
</body>
</html>
