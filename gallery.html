<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase</title>
  <link rel="stylesheet" href="q3-gallery.css">
</head>
<body>
  <header>
    <h1>Image Gallery Showcase</h1>
    <p>Hover on images to scale and add overlay.</p>
  </header>

  <main>
    <section class="gallery">
      <figure>
        <img src="https://via.placeholder.com/250" alt="Image 1">
        <figcaption>Image One</figcaption>
      </figure>
      <figure>
        <img src="https://via.placeholder.com/250" alt="Image 2">
        <figcaption>Image Two</figcaption>
      </figure>
      <figure>
        <img src="https://via.placeholder.com/250" alt="Image 3">
        <figcaption>Image Three</figcaption>
      </figure>
      <figure>
        <img src="https://via.placeholder.com/250" alt="Image 4">
        <figcaption>Image Four</figcaption>
      </figure>
      <figure>
        <img src="https://via.placeholder.com/250" alt="Image 5">
        <figcaption>Image Five</figcaption>
      </figure>
      <figure>
        <img src="https://via.placeholder.com/250" alt="Image 6">
        <figcaption>Image Six</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>Responsive layout with hover effects using CSS Grid and Flexbox.</p>
  </footer>
</body>
</html>
