<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today's Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h2 class="text-center mb-4 lead fw-bold">Today's Menu</h2>

  <!-- Menu Table -->
  <table class="table table-bordered text-center">
    <thead class="table-dark">
      <tr><th>Category</th><th>Item</th><th>Price</th></tr>
    </thead>
    <tbody>
      <tr><td>Starter</td><td>Garlic Bread</td><td>$5</td></tr>
      <tr><td>Main Course</td><td>Pasta Alfredo</td><td>$12</td></tr>
      <tr><td>Dessert</td><td>Chocolate Lava Cake</td><td>$7</td></tr>
    </tbody>
  </table>

  <!-- Chef's Specials -->
  <h4 class="mt-4">Chef’s Specials</h4>
  <ul class="list-group mb-4">
    <li class="list-group-item">Grilled Salmon with Lemon Butter</li>
    <li class="list-group-item">Stuffed Chicken Parmesan</li>
  </ul>

  <!-- Food Image -->
  <figure class="text-center">
    <img src="https://via.placeholder.com/400x250" class="img-fluid rounded" alt="Food">
    <figcaption class="lead mt-2">Delicious Meals Made Fresh Daily!</figcaption>
  </figure>
</div>
</body>
</html>
