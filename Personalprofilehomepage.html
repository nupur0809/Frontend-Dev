<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nupur Agarwal | Portfolio</title>
  
  <!-- ✅ Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #f8f9fa; /* light gray background */
    }
    .profile-img {
      width: 180px;
      height: 180px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- ✅ Header Section -->
  <header class="bg-light text-dark text-center p-5">
    <h1 class="fw-bold">Nupur Agarwal</h1>
    <p class="lead mb-0">Aspiring Web Developer | Tech Enthusiast | Learner</p>
  </header>

  <!-- ✅ Profile Section -->
  <section class="container text-center mt-4">
    <img src="https://via.placeholder.com/180" 
         alt="Profile Image" 
         class="img-fluid rounded-circle profile-img mb-3">

    <div class="mt-3 mb-3">
      <button class="btn btn-primary me-2">Hire Me</button>
      <button class="btn btn-outline-dark">Download CV</button>
    </div>
  </section>

  <!-- ✅ Contact Form -->
  <section class="container mt-5 mb-5 bg-light p-5 rounded shadow-sm">
    <h3 class="text-center mb-4 fw-bold">Contact Me</h3>
    <form>
      <div class="mb-3">
        <input type="text" class="form-control" placeholder="Your Name">
      </div>
      <div class="mb-3">
        <input type="email" class="form-control" placeholder="Your Email">
      </div>
      <div class="mb-3">
        <textarea class="form-control" rows="4" placeholder="Your Message"></textarea>
      </div>
      <div class="text-center">
        <button type="submit" class="btn btn-success px-4">Send Message</button>
      </div>
    </form>
  </section>

  <!-- ✅ Footer -->
  <footer class="text-center py-3 bg-dark text-light">
    <small>© 2025 Nupur Agarwal. All Rights Reserved.</small>
  </footer>

  <!-- ✅ Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
