<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini UI Layout</title>
  <link rel="stylesheet" href="q10-miniui.css">
</head>
<body>
  <header>
    <h1>Mini User Interface</h1>
  </header>

  <main>
    <section class="card">
      <img src="https://via.placeholder.com/100" alt="Small Image" class="card-img">
      <form>
        <input type="text" placeholder="Enter text">
        <button type="submit">Submit</button>
      </form>
      <button class="secondary">Cancel</button>
    </section>
  </main>

  <footer>
    <p>Responsive mini layout with form, buttons, and image.</p>
  </footer>
</body>
</html>
