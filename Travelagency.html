<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel Agency Showcase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <h2 class="text-center mb-4">Explore Destinations</h2>

  <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active" data-bs-interval="2000">
        <img src="https://tse2.mm.bing.net/th/id/OIP.gASMlPqsrIt_9q8Y76PZKgHaFj?pid=Api&P=0&h=180" class="d-block w-100 img-fluid">
      </div>
      <div class="carousel-item" data-bs-interval="2000">
        <img src="https://tse2.mm.bing.net/th/id/OIP.gASMlPqsrIt_9q8Y76PZKgHaFj?pid=Api&P=0&h=180" class="d-block w-100 img-fluid">
      </div>
      <div class="carousel-item" data-bs-interval="2000">
        <img src="https://tse2.mm.bing.net/th/id/OIP.gASMlPqsrIt_9q8Y76PZKgHaFj?pid=Api&P=0&h=180" class="d-block w-100 img-fluid">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <div class="mt-4">
    <h5>Booking Completion</h5>
    <div class="progress">
      <div class="progress-bar progress-bar-striped progress-bar-animated" style="width:70%">70%</div>
    </div>
  </div>

  <footer class="text-center mt-5 py-3 bg-dark text-light">
    ✈️ Contact us: travel@agency.com | +91-9876543210
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
